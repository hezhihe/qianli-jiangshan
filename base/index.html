<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>千里江山 · 粒子山河 Demo</title>
  <meta name="description" content="A WebGL particle landscape inspired by A Thousand Li of Rivers and Mountains." />
  <link rel="stylesheet" href="./src/css/styles.css?v=20260616-verse1" />
  <script src="./vendor/three.min.js"></script>
</head>
<body>
  <main id="app" aria-label="千里江山粒子山河沉浸式预览">
    <canvas id="stage" aria-hidden="true"></canvas>

    <section class="hud" aria-label="项目说明面板">
      <p class="eyebrow">QIANLI SHANHE / WEBGL STUDY</p>
      <h1>千里江山<br><span>粒子山河</span></h1>
      <div class="verse" aria-label="观千里江山图题诗">
        <p class="verse-title">观千里江山图</p>
        <p>千峰叠翠镇苍穹，万里沧江贯禹东。</p>
        <p>一纸丹青横九域，千秋浩气壮神州。</p>
      </div>
      <div class="actions">
        <button id="fullscreen-btn" type="button">进入全屏沉浸</button>
        <button id="reset-btn" type="button" class="ghost">归正视角</button>
      </div>
      <p class="hint">移动鼠标控制镜头；滚轮推进；空格暂停/继续。</p>
    </section>

    <aside class="poem" aria-hidden="true">
      <span>石青入峰</span>
      <span>石绿生烟</span>
      <span>金水行谷</span>
    </aside>

    <div id="loading" class="loading" role="status">铺展长卷中…</div>
  </main>

  <script type="module" src="./src/js/app.js?v=20260617-composition1"></script>
</body>
</html>
